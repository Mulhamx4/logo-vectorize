name: publish to npm

# Publishes logo-vectorizer when a GitHub release is published. The release tag must be
# v<version from package.json>. No token is stored anywhere: npm trusted publishing (OIDC).
# One-time setup on npmjs.com → logo-vectorizer → Settings → Trusted Publisher:
#   GitHub Actions · Mulhamx4 / logo-vectorize · publish.yml
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # lets npm verify this workflow instead of a token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1+
      - name: Release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then echo "release tag $TAG does not match package.json v$version"; exit 1; fi
      - run: npm publish
